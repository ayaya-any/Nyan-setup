name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --release --verbose

      - name: Build release binaries
        run: cargo build --release

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $Tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          $DistDir = (New-Item -ItemType Directory -Force -Path "dist").FullName

          # 1. Copy standalone Nyan Setup Studio & CLI binary
          $ExeDist = Join-Path $DistDir "nyan-setup.exe"
          Copy-Item -Path "target/release/nyan-setup.exe" -Destination $ExeDist
          $ExeDistResolved = (Resolve-Path $ExeDist).Path

          # 2. Generate a template package.sample.json configuration file
          $ConfigSample = Join-Path $DistDir "package.sample.json"
          Start-Process -FilePath $ExeDistResolved -ArgumentList "init-config", $ConfigSample -NoNewWindow -Wait

          # 3. Build a standalone demo installer Setup executable
          $DemoInstaller = Join-Path $DistDir "NyanStudioApp_Demo_Setup.exe"
          Start-Process -FilePath $ExeDistResolved -ArgumentList "build-demo", $DemoInstaller -NoNewWindow -Wait

          # 4. Pack a ZIP archive bundle containing executable, config template, and docs
          $ZipBundle = Join-Path $DistDir "nyan-setup-$Tag-windows-x86_64.zip"
          $StageDir = Join-Path $DistDir "bundle_staging"
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null
          Copy-Item -Path $ExeDist -Destination $StageDir
          Copy-Item -Path $ConfigSample -Destination $StageDir
          Copy-Item -Path "README.md" -Destination $StageDir
          Copy-Item -Path "docs" -Destination $StageDir -Recurse
          Compress-Archive -Path "$StageDir/*" -DestinationPath $ZipBundle -Force
          Remove-Item -Recurse -Force $StageDir

          # 5. Generate SHA256 checksums for all release assets
          $HashFiles = Get-ChildItem -Path $DistDir -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $ChecksumLines = foreach ($file in $HashFiles) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            $name = $file.Name
            "$hash  $name"
          }
          $ChecksumLines | Out-File -FilePath (Join-Path $DistDir "SHA256SUMS.txt") -Encoding utf8

          Write-Host "Prepared release artifacts in $DistDir:"
          Get-ChildItem -Path $DistDir | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/nyan-setup.exe
            dist/NyanStudioApp_Demo_Setup.exe
            dist/nyan-setup-*.zip
            dist/package.sample.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
